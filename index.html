<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusrat Nasrin - Professional Profile</title>
    <style>
        body { 
            margin: 0; 
            background: #080c14; 
            font-family: 'Arial', sans-serif; 
            color: #ffffff; 
            line-height: 1.8; 
            font-size: 2rem; 
        }
        .container { max-width: 900px; margin: auto; padding: 20px; text-align: center; }
        
        .profile-header { margin: 40px 0 30px 0; }
        
        /* প্রোফাইল ছবির স্টাইল */
        .profile-img-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            border: 3px solid #ff7414;
            overflow: hidden;
            background: #1a202c;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name { color: #ff7414; font-size: 3.5rem; font-weight: bold; margin-bottom: 10px; }
        .designation { color: #d1d5db; font-size: 1.8rem; margin-bottom: 40px; }
        
        /* বাটনগুলোকে পাশাপাশি বা সুন্দর গ্রিডে সাজানোর জন্য */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 20px; 
        }
        .menu-btn { 
            padding: 22px; 
            background: #1a202c; 
            border: 2px solid #ff7414; 
            color: #ff7414; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 12px; 
            font-size: 1.8rem; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .menu-btn:hover { 
            background: #ff7414; 
            color: #ffffff; 
            transform: scale(1.02); 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <!-- এখানে ছবির লিংকের জায়গায় নুসরাত আপুর ছবির লিংক বসিয়ে দেবেন -->
            <div class="profile-img-container">
                <img src="YOUR_IMAGE_LINK_HERE.jpg" alt="Nusrat Nasrin" class="profile-img">
            </div>
            <div class="name">Nusrat Nasrin</div>
            <div class="designation">Agriculturist | Aquaculturist | Head of Marketing</div>
        </div>

        <div class="menu-grid">
            <a href="agriculturist.html" class="menu-btn">Agriculturist</a>
            <a href="aquaculturist.html" class="menu-btn">Aquaculturist</a>
            <a href="academic-research.html" class="menu-btn">Academic and Research</a>
            <a href="marketing.html" class="menu-btn">Head of Marketing</a>
            <a href="about.html" class="menu-btn">About Me</a>
            <a href="resume.html" class="menu-btn">Resume / CV</a>
            <a href="contact.html" class="menu-btn">Contact</a>
        </div>
    </div>
</body>
</html>

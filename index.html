<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusrat Nasrin - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #0b111e;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .image-container {
            width: 100%;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .name-section {
            text-align: center;
            margin-top: 20px;
        }

        .name-section h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .title-tags {
            font-size: 10px;
            color: #ff7f00;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
            text-transform: uppercase;
            text-align: center;
            padding: 0 10px;
        }

        .button-group {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .menu-btn {
            flex: 1;
            background-color: #111a2e;
            border: 1px solid #ff7f00;
            color: #ffffff;
            padding: 14px 10px;
            text-align: center;
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .menu-btn.primary {
            background-color: #ff7f00;
            color: #ffffff;
            border: 1px solid #ff7f00;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ক্যাশ সমস্যা দূর করার জন্য ?v=2 যুক্ত করা হয়েছে -->
        <div class="image-container">
            <img src="nusrat.jpg?v=2" alt="Nusrat Nasrin">
        </div>

        <div class="name-section">
            <h1>NUSRAT NASRIN</h1>
            <div class="title-tags">AGRICULTURIST | AQUACULTURIST | HEAD OF MARKETING</div>
        </div>

        <div class="button-group">
            <div class="btn-row">
                <a href="#" class="menu-btn">Agriculturist</a>
                <a href="#" class="menu-btn">Overseas Academic & Research</a>
            </div>
            <div class="btn-row">
                <a href="#" class="menu-btn">Head of Marketing</a>
                <a href="#" class="menu-btn">About Me</a>
            </div>
            <div class="btn-row">
                <a href="#" class="menu-btn primary">Profile / CV</a>
                <a href="#" class="menu-btn">Contact</a>
            </div>
        </div>
    </div>

</body>
</html>

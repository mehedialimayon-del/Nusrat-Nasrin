<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusrat Nasrin - Profile</title>
    <style>
        body { 
            margin: 0; 
            background: #080c14; 
            font-family: 'Arial', sans-serif; 
            color: #ffffff; 
            line-height: 1.8; 
        }
        .container { max-width: 900px; margin: auto; padding: 0 0 40px 0; text-align: center; }
        
        .hero-img-container {
            width: 100%;
            height: 550px;
            overflow: hidden;
            background: #1a202c;
            border-bottom: 3px solid #ff7414;
        }
        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .profile-content {
            padding: 20px;
            margin-top: -50px;
        }

        .name { color: #ffffff; font-size: 3.2rem; font-weight: bold; margin: 20px 0 10px 0; letter-spacing: 1px; }
        .designation { color: #ff7414; font-size: 1.6rem; font-weight: bold; margin-bottom: 35px; letter-spacing: 1px; }
        
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            padding: 0 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .menu-btn { 
            padding: 20px 15px; 
            background: #1a202c; 
            border: 2px solid #ff7414; 
            color: #ffffff; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 10px; 
            font-size: 1.4rem; 
            transition: 0.3s; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }
        
        .menu-btn.highlight-btn { background: #ff7414; }

        .menu-btn:hover { 
            background: #ff7414; 
            transform: scale(1.02); 
        }

        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
            .name { font-size: 2.2rem; }
            .hero-img-container { height: 400px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-img-container">
            <img src="https://i.postimg.cc/s2fSyMtr/file-00000000d2748208b493ad2c6c79b0a3.png" alt="Nusrat Nasrin" class="hero-img">
        </div>

        <div class="profile-content">
            <div class="name">NUSRAT NASRIN</div>
            <div class="designation">AQUACULTURE RESEARCHER</div>

            <div class="menu-grid">
                <a href="research.html" class="menu-btn">Research</a>
                <a href="education.html" class="menu-btn">Education</a>
                <a href="publications.html" class="menu-btn">Publications</a>
                <a href="about.html" class="menu-btn">About Me</a>
                <a href="gallery.html" class="menu-btn">Gallery</a>
                <a href="contact.html" class="menu-btn highlight-btn">Contact</a>
            </div>
        </div>
    </div>
</body>
</html>

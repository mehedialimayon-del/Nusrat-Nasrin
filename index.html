   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',Arial,sans-serif;
    background:#071b3a;
    color:#10213f;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

:root{
    --navy:#071b3a;

    --blue:#1769d5;

    --light:#f5f9ff;

}


/* =========================================================
   NAVBAR
========================================================= */

.navbar{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);

    width:calc(100% - 28px);
    max-width:1180px;

    height:62px;

    background:rgba(255,255,255,.96);
    backdrop-filter:blur(15px);

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    z-index:9999;

    box-shadow:0 12px 35px rgba(10,45,90,.10);
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;

    font-size:14px;
    font-weight:800;
    color:#193253;
}

.logo-mark{
    width:38px;
    height:38px;

    border-radius:50%;

    background:#fff;
    border:1px solid #d8e5f6;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#174e9b;
    font-size:12px;
    font-weight:800;
}

.logo span{
    color:#174e9b;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:29px;
}

.nav-links a{
    font-size:11px;
    font-weight:600;
    color:#243553;

    position:relative;
    padding:23px 0;

    transition:.3s;
}

.nav-links a:hover{
    color:#1769d5;
}

.nav-links a.active::after{
    content:"";

    position:absolute;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:34px;
    height:3px;

    background:#1769d5;

    border-radius:10px;
}

.menu-btn{
    display:none;

    width:40px;
    height:40px;

    border:0;
    border-radius:10px;

    background:#edf5ff;

    color:#1769d5;

    font-size:20px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:620px;

    padding-top:95px;

    background:
        radial-gradient(
            circle at 85% 30%,
            rgba(45,131,246,.09),
            transparent 32%
        ),
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f5f9ff 100%
        );

    position:relative;
    overflow:hidden;

    border-radius:0 0 42px 42px;
}

.hero::before{
    content:"";

    position:absolute;

    width:520px;
    height:520px;

    border-radius:50%;

    background:#edf5ff;

    right:-220px;
    top:-100px;

    opacity:.75;
}

.hero::after{
    content:"";

    position:absolute;

    width:170px;
    height:170px;

    right:30px;
    bottom:-60px;

    background-image:
        radial-gradient(
            #c8d9ef 1.5px,
            transparent 1.5px
        );

    background-size:10px 10px;

    opacity:.65;
}

.container{
    width:calc(100% - 70px);
    max-width:1120px;
    margin:auto;
    position:relative;
    z-index:2;
}

.hero-grid{
    min-height:525px;

    display:grid;

    grid-template-columns:1fr 1fr;

    align-items:center;

    gap:35px;
}

.hero-content{
    padding-left:5px;
}

.welcome{
    display:flex;
    align-items:center;

    gap:12px;

    color:#4c5d76;

    font-size:10px;

    font-weight:600;

    letter-spacing:1.6px;

    margin-bottom:22px;
}

.welcome::before{
    content:"";

    width:25px;
    height:2px;

    background:#365d8f;
}

.hero h1{
    font-size:clamp(52px,6vw,75px);

    line-height:.91;

    letter-spacing:-3px;

    font-weight:900;

    color:#071b3a;

    margin-bottom:23px;
}

.hero h1 span{
    color:#185eb9;
}

.designation{
    font-size:14px;

    letter-spacing:3px;

    font-weight:600;

    color:#354762;

    line-height:1.65;
}

.designation strong{
    color:#185eb9;
}

.hero-line{
    width:58px;
    height:3px;

    background:#1769d5;

    margin:22px 0;
}

.hero-description{
    max-width:330px;

    color:#65738a;

    font-size:12px;

    line-height:1.85;
}

.socials{
    display:flex;
    gap:13px;
    margin-top:25px;
}

.socials a{
    width:45px;
    height:45px;

    border-radius:50%;

    background:white;

    border:1px solid #e1eaf5;

    box-shadow:0 8px 18px rgba(30,70,120,.10);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#173f75;

    font-size:17px;

    transition:.3s;
}

.socials a:hover{
    transform:translateY(-4px);

    background:#1769d5;
    color:white;
}

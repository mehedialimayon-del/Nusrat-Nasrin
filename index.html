<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parves Hira | Head of Sales</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#061a38;
    color:#12233f;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

/* NAVBAR */

.navbar{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:1150px;
    height:62px;
    background:rgba(255,255,255,.97);
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    z-index:1000;
    box-shadow:0 10px 30px rgba(0,30,70,.12);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    font-weight:800;
    color:#1c3558;
}

.logo-circle{
    width:38px;
    height:38px;
    border:1px solid #d8e4f2;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#1857a5;
    font-size:12px;
}

.nav{
    display:flex;
    gap:30px;
}

.nav a{
    font-size:12px;
    font-weight:600;
    color:#263750;
}

.nav a:hover{
    color:#1769d5;
}

.menu{
    display:none;
    border:0;
    background:#edf5ff;
    color:#1769d5;
    width:40px;
    height:40px;
    border-radius:11px;
    font-size:21px;
}

/* HERO */

.hero{
    min-height:650px;
    padding-top:110px;
    background:
        radial-gradient(circle at 85% 30%,#e3efff 0%,transparent 32%),
        linear-gradient(135deg,#ffffff,#f2f7fd);
    border-radius:0 0 45px 45px;
    overflow:hidden;
    position:relative;
}

.hero:before{
    content:"";
    position:absolute;
    width:560px;
    height:560px;
    border-radius:50%;
    background:#edf5ff;
    right:-260px;
    top:-120px;
}

.container{
    width:calc(100% - 70px);
    max-width:1120px;
    margin:auto;
    position:relative;
    z-index:2;
}

.hero-grid{
    min-height:520px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:35px;
}

.welcome{
    font-size:11px;
    letter-spacing:2px;
    color:#586981;
    font-weight:600;
    margin-bottom:20px;
}

.welcome:before{
    content:"";
    display:inline-block;
    width:25px;
    height:2px;
    background:#286dc0;
    vertical-align:middle;
    margin-right:10px;
}

h1{
    font-size:70px;
    line-height:.9;
    letter-spacing:-3px;
    color:#071b3a;
    margin-bottom:25px;
}

h1 span{
    color:#1763bd;
}

.designation{
    font-size:14px;
    line-height:1.7;
    letter-spacing:2.5px;
    font-weight:600;
    color:#40526b;
}

.designation span{
    color:#1763bd;
}

.hero-line{
    width:60px;
    height:3px;
    background:#1769d5;
    margin:22px 0;
}

.description{
    max-width:390px;
    color:#66758b;
    font-size:13px;
    line-height:1.8;
}

.socials{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.socials a{
    width:45px;
    height:45px;
    background:#fff;
    border:1px solid #dfe8f2;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#183d6c;
    font-weight:600;
    box-shadow:0 8px 20px rgba(30,70,120,.1);
}

/* PROFILE IMAGE */

.photo-area{
    height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.photo-ring{
    width:470px;
    height:470px;
    border-radius:50%;
    border:1px solid #cad8e8;
    position:absolute;
}

.photo-ring.two{
    width:510px;
    height:510px;
}

.photo-ring.three{
    width:530px;
    height:530px;
    border:3px solid #17477f;
    border-left-color:transparent;
    border-bottom-color:#287bdc;
    transform:rotate(25deg);
}

.photo{
    width:420px;
    height:420px;
    border-radius:50%;
    overflow:hidden;
    border:10px solid white;
    background:#092451;
    box-shadow:0 20px 45px rgba(10,40,80,.2);
    z-index:3;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
}

/* DARK CONTENT */

.dark{
    background:#061a38;
    padding:45px 0 60px;
    color:#fff;
}

.section-title{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:24px;
}

.section-title h2{
    font-size:12px;
    letter-spacing:1.5px;
    white-space:nowrap;
}

.section-line{
    flex:1;
    height:1px;
    background:rgba(150,190,235,.3);
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:25px;
}

.button-card{
    min-height:78px;
    padding:15px 18px;
    background:#fff;
    color:#172944;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:.25s;
}

.button-card:hover{
    transform:translateY(-4px);
}

.button-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#edf5ff;
    color:#1763bd;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
}

.button-card strong{
    font-size:11px;
}

.arrow{
    width:27px;
    height:27px;
    border-radius:50%;
    background:#e7f0fb;
    color:#1769d5;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* SKILLS */

.skills{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.skill{
    background:#fff;
    color:#142542;
    border-radius:20px;
    padding:28px 22px;
    text-align:center;
    min-height:245px;
}

.skill-icon{
    width:62px;
    height:62px;
    border-radius:50%;
    background:#1559a9;
    color:#fff;
    margin:0 auto 22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.skill h3{
    font-size:14px;
    margin-bottom:15px;
}

.skill p{
    font-size:11px;
    color:#5e6d82;
    line-height:1.8;
}

.blue-line{
    width:22px;
    height:3px;
    background:#1769d5;
    margin:25px auto 0;
}

/* STATS */

.stats{
    margin-top:28px;
    background:#09234a;
    border:1px solid rgba(100,160,230,.25);
    border-radius:20px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.stat{
    padding:24px 10px;
    text

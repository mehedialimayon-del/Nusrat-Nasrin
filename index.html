<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parves Hira | Head of Sales</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:#07152d;
    color:#fff;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

:root{
    --navy:#07152d;
    --navy2:#0b2143;
    --blue:#3c8cff;
    --blue2:#6caeff;
    --text:#f5f8ff;
    --muted:#a9b8ce;
    --glass:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.11);
}


/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:rgba(45,126,255,.10);
    filter:blur(100px);
    border-radius:50%;
    top:-200px;
    right:-180px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    background:rgba(0,180,255,.06);
    filter:blur(100px);
    border-radius:50%;
    bottom:-180px;
    left:-180px;
    pointer-events:none;
}


/* ================= NAVBAR ================= */

.navbar{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    width:min(1180px,92%);
    height:68px;
    padding:0 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(7,21,45,.78);
    border:1px solid var(--border);
    backdrop-filter:blur(18px);

    border-radius:18px;
    z-index:1000;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-mark{
    width:39px;
    height:39px;
    border-radius:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,var(--blue),#175dcc);

    font-size:13px;
    font-weight:800;
}

.brand-name{
    font-size:14px;
    font-weight:800;
    letter-spacing:.8px;
}

.brand-name span{
    color:var(--blue2);
}

.nav{
    display:flex;
    gap:25px;
}

.nav a{
    font-size:12px;
    font-weight:600;
    color:#b9c6d9;
    transition:.3s;
}

.nav a:hover{
    color:#fff;
}

.menu{
    display:none;
    border:0;
    background:var(--glass);
    color:white;
    width:40px;
    height:40px;
    border-radius:10px;
    font-size:18px;
}


/* ================= HERO ================= */

.hero{
    min-height:100vh;
    padding:150px 0 80px;
    position:relative;
}

.container{
    width:min(1150px,90%);
    margin:auto;
}

.hero-grid{
    min-height:650px;
    display:grid;
    grid-template-columns:1.15fr .85fr;
    align-items:center;
    gap:70px;
}

.eyebrow{
    color:var(--blue2);
    font-size:11px;
    font-weight:800;
    letter-spacing:3px;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(50px,7vw,88px);
    line-height:.92;
    letter-spacing:-4px;
    font-weight:900;
    margin-bottom:25px;
}

.hero h1 span{
    color:var(--blue);
}

.designation{
    font-size:17px;
    line-height:1.8;
    color:#d4deec;
    font-weight:600;
}

.designation strong{
    color:var(--blue2);
}

.hero-line{
    width:65px;
    height:3px;
    background:var(--blue);
    margin:27px 0;
    border-radius:20px;
}

.hero-text{
    max-width:560px;
    color:var(--muted);
    font-size:14px;
    line-height:1.9;
}

.hero-buttons{
    display:flex;
    gap:12px;
    margin-top:32px;
    flex-wrap:wrap;
}

.btn{
    padding:13px 21px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    transition:.3s;
}

.btn-primary{
    background:var(--blue);
    color:white;
}

.btn-primary:hover{
    background:#5ca1ff;
    transform:translateY(-3px);
}

.btn-outline{
    border:1px solid var(--border);
    background:var(--glass);
    color:#dbe6f5;
}

.btn-outline:hover{
    border-color:var(--blue);
    transform:translateY(-3px);
}


/* ================= PROFILE PHOTO ================= */

.profile-area{
    display:flex;
    justify-content:center;
    align-items:center;
}

.profile-card{
    width:350px;
    padding:25px;
    border-radius:30px;

    background:linear-gradient(
        145deg,
        rgba(255,255,255,.09),
        rgba(255,255,255,.025)
    );

    border:1px solid var(--border);
    box-shadow:0 30px 80px rgba(0,0,0,.25);
    text-align:center;
}

.profile-photo{
    width:205px;
    height:205px;
    margin:auto;
    padding:5px;

    border-radius:50%;
    background:linear-gradient(
        145deg,
        var(--blue2),
        var(--blue),
        #123f88
